[package]
name = "pdf-signature-ffi"
version = "0.1.0"
edition = "2021"
license = "BSD-2-Clause"
publish = false

[lib]
name = "pdf_signature_ffi"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
underskrift = { path = "../../../vendor/pqc-underskrift", default-features = false, features = ["external-composite"] }

[dev-dependencies]
der = { version = "0.7", features = ["pem"] }
x509-cert = { version = "0.2", features = ["pem"] }

[profile.release]
opt-level = 3
panic = "unwind"
